<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>合同套打 / Contract {{.ContractNum}}</title>
    <script src="/static/js/LodopFuncs.js"></script>
    <script src="/static/js/demo.js"></script>
</head>
<body>
<h1>抵押合同 / Mortgage contract demo</h1>
<h2>合同编号 / Contract number: {{.ContractNum}}</h2>
<p>此演示使用示例数据，需安装 LODOP/C-Lodop 才能设计或预览打印模板。</p>
<p>This demo uses sample data. Install LODOP/C-Lodop to design or preview the print template.</p>
<p><a href="https://www.lodop.net/download.html" target="_blank" rel="noopener">LODOP/C-Lodop 下载 / Downloads</a></p>
<div id="notices" role="status" aria-live="polite"></div>
<button type="button" id="design">模板设计 / Design</button>
<button type="button" id="preview">打印预览 / Preview</button>
<p><a href="/print/">返回 / Back</a></p>
<script>
    async function showPrint(mode) {
        var buttons = document.querySelectorAll('button');
        var notices = document.getElementById('notices');
        buttons.forEach(function (button) { button.disabled = true; });
        notices.textContent = '加载示例数据 / Loading sample data…';
        try {
            var response = await fetch('/static/json/demo.json');
            if (!response.ok) throw new Error('无法加载示例数据 / Unable to load sample data');
            var data = await response.json();
            var printer = CreatePrintPage(data);
            if (mode === 'design') printer.PRINT_DESIGN();
            else printer.PREVIEW();
            notices.textContent = '';
        } catch (error) {
            notices.textContent = error.message;
        } finally {
            buttons.forEach(function (button) { button.disabled = false; });
        }
    }
    document.getElementById('design').addEventListener('click', function () { showPrint('design'); });
    document.getElementById('preview').addEventListener('click', function () { showPrint('preview'); });
</script>
</body>
</html>
