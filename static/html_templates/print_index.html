<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>合同套打 / Contract printing demo</title>
</head>
<body>
<h1>合同套打 / Contract printing demo</h1>
<p>输入合同编号，预览示例数据。此演示不查询真实合同。</p>
<p>Enter a contract number to preview sample data. This demo does not retrieve real contracts.</p>
<form id="contractForm">
    <label for="contractNum">合同编号 / Contract number</label>
    <input type="text" id="contractNum" required maxlength="100" value="999">
    <button type="submit">打开示例 / Open demo</button>
</form>
<p>{{.TimeNow}} — Demo</p>
<script>
    document.getElementById('contractForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var number = document.getElementById('contractNum').value.trim();
        if (number) window.location.href = '/print/' + encodeURIComponent(number);
    });
</script>
</body>
</html>
